name: release
# Tag: publish. Manual run with no tag: dry run of the branch (build, sign, notarize, upload artifacts,
# publish nothing). Manual run naming a tag: build that tag and publish it again - the repair for a
# release that went out without its files.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag to build and publish again; empty for a dry run"
        required: false
        default: ""
permissions:
  contents: write
env:
  # what this run publishes: the tag pushed, or the one named by hand; empty is a dry run
  TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck
      - name: The tag must be the package version
        if: env.TAG != ''
        run: test "$(bun -e 'console.log(require("./package.json").version)')" = "${TAG#v}"

  build-linux:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run scripts/release.ts build --only linux
      - run: bun run scripts/release.ts pack
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            dist/release/*.tar.gz
            dist/release/checksums-*.txt

  build-darwin:
    needs: verify
    runs-on: macos-latest
    env:
      MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
      MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run scripts/release.ts build --only darwin
      - name: Sign and notarize (when a signing identity is configured)
        if: env.MACOS_SIGN_P12 != ''
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/konvoy.keychain-db"
          echo "$MACOS_SIGN_P12" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          security import "$RUNNER_TEMP/sign.p12" -P "$MACOS_SIGN_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' 'NR==1{print $2}')
          printf '%s' "$MACOS_NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
          for dir in dist/release/darwin_*; do
            codesign --force --options runtime --timestamp --entitlements scripts/entitlements.plist --sign "$IDENTITY" "$dir/konvoy"
            ditto -c -k --keepParent "$dir/konvoy" "$dir/konvoy.zip"
            xcrun notarytool submit "$dir/konvoy.zip" --issuer "$MACOS_NOTARY_ISSUER_ID" --key-id "$MACOS_NOTARY_KEY_ID" --key "$RUNNER_TEMP/notary.p8" --wait
            rm "$dir/konvoy.zip"
            codesign --verify --verbose "$dir/konvoy"
          done
      - run: bun run scripts/release.ts pack
      - uses: actions/upload-artifact@v4
        with:
          name: release-darwin
          path: |
            dist/release/*.tar.gz
            dist/release/checksums-*.txt

  release:
    needs: [build-linux, build-darwin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          path: dist/release
          merge-multiple: true
      - run: cat dist/release/checksums-*.txt > dist/release/checksums.txt && cat dist/release/checksums.txt
      - run: bun run scripts/tap-cask.ts "$(bun -e 'console.log(require("./package.json").version)')" dist/release/checksums.txt > dist/release/konvoy.rb
      - name: Dry run - keep what a tag would have published
        if: env.TAG == ''
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run
          path: dist/release
      # A release made on GitHub's Releases page before this run - a draft with notes, usually - is
      # completed, not skipped: skipping it is how v0.4.0 and v0.5.0 went out with no files while the
      # tap already pointed at them, and brew install failed with a 404.
      - name: GitHub release - created, or completed with its files and published
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files=(dist/release/*.tar.gz dist/release/checksums.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --draft=false
          else
            gh release create "$TAG" "${files[@]}" --title "$TAG" --generate-notes --verify-tag
          fi
      # the cask names these URLs and their checksums; the tap moves only once brew could fetch them
      - name: Every file the cask points at downloads
        if: env.TAG != ''
        run: |
          set -euo pipefail
          for f in dist/release/*.tar.gz; do
            url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/$(basename "$f")"
            for attempt in 1 2 3 4 5; do
              curl -fsIL -o /dev/null "$url" && break
              [ "$attempt" = 5 ] && { echo "::error::$url does not download - the tap is not updated"; exit 1; }
              sleep 5
            done
            echo "ok $url"
          done
      - name: Update the Homebrew tap (needs a PAT with contents:write on doguyilmaz/homebrew-tap)
        if: env.TAG != '' && env.HOMEBREW_TAP_GITHUB_TOKEN != ''
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${HOMEBREW_TAP_GITHUB_TOKEN}@github.com/doguyilmaz/homebrew-tap.git" "$RUNNER_TEMP/tap"
          mv dist/release/konvoy.rb "$RUNNER_TEMP/tap/Casks/konvoy.rb"
          cd "$RUNNER_TEMP/tap"
          git add Casks/konvoy.rb
          git diff --quiet --cached && { echo "tap already carries this version"; exit 0; }
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "konvoy ${TAG}" || echo "cask unchanged"
          git push
      # bun publish has no OIDC exchange; trusted publishing needs npm's CLI
      - name: Publish to npm
        if: env.TAG != ''
        run: |
          set -euo pipefail
          V=$(bun -e 'console.log(require("./package.json").version)')
          if curl -fsS "https://registry.npmjs.org/@doguyilmaz%2Fkonvoy/$V" >/dev/null 2>&1; then echo "@doguyilmaz/konvoy@$V is already on npm"; exit 0; fi
          npm install -g npm@latest >/dev/null
          npm publish --provenance --access public
